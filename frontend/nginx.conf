server {
    listen 80;
    root /usr/share/nginx/html;

    # All API calls go through the gateway, exactly like in dev.
    location /api/ {
        proxy_pass http://api-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;            # needed for the live notification stream (SSE)
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
