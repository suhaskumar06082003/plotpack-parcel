server:
  port: ${PORT:8183}

spring:
  application:
    name: package-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/plotpack_package?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:plotpack}
    hikari:
      maximum-pool-size: 30
      # READ COMMITTED: no gap locks, so the outbox poller's SELECT ... FOR UPDATE SKIP LOCKED
      # never blocks new INSERTs into outbox_event. Row locks (FOR UPDATE on a bin) behave the same.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

plotpack:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8181}
  max-bins-per-customer: 3
  outbox:
    poll-interval-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
